<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blag Valentine 💝</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #ff9ff3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: bounceIn 0.8s ease;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '💕';
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 5rem;
            opacity: 0.1;
            transform: rotate(15deg);
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .squash-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .squash-logo::before {
            content: 'S';
            color: #f39c12;
            font-size: 3rem;
            font-weight: bold;
            font-style: italic;
        }

        .squash-logo::after {
            content: '';
            position: absolute;
            width: 110%;
            height: 110%;
            border: 3px solid #f39c12;
            border-radius: 50%;
            top: -5%;
            left: -5%;
        }

        h2 {
            color: #e74c3c;
            margin-bottom: 10px;
            font-size: 1.8rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .squash-name {
            color: #2c3e50;
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .question-box {
            background: linear-gradient(135deg, #fff5f5 0%, #ffe0e0 100%);
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            border: 2px solid #ffb8b8;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question {
            font-size: 1.4rem;
            color: #2c3e50;
            font-weight: 600;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
            min-height: 80px;
            align-items: center;
        }

        button {
            padding: 18px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        .btn-option {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            transform: scale(var(--option-scale, 1));
        }

        .btn-option:hover {
            transform: scale(calc(var(--option-scale, 1) * 1.1));
            box-shadow: 0 8px 25px rgba(116, 185, 255, 0.4);
        }

        .btn-yes {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white;
            transform: scale(var(--yes-scale, 1));
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(var(--yes-scale, 1)); }
            50% { transform: scale(calc(var(--yes-scale, 1) * 1.05)); }
        }

        .btn-yes:hover {
            transform: scale(calc(var(--yes-scale, 1) * 1.15));
            box-shadow: 0 10px 30px rgba(0, 184, 148, 0.5);
        }

        .btn-no {
            background: linear-gradient(135deg, #ff7675 0%, #d63031 100%);
            color: white;
            transform: scale(var(--no-scale, 1));
            transition: all 0.3s ease;
        }

        .btn-no:hover {
            transform: scale(calc(var(--no-scale, 1) * 0.95));
            opacity: 0.8;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #dfe6e9;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e84393, #fd79a8);
            border-radius: 10px;
            transition: width 0.5s ease;
            width: var(--progress, 0%);
        }

        .step-indicator {
            color: #636e72;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        /* Ekran rezilta */
        .result-screen {
            display: none;
            animation: zoomIn 0.8s ease;
        }

        .result-screen.show {
            display: block;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .big-heart {
            font-size: 8rem;
            animation: heartbeatBig 1s ease-in-out infinite;
            margin: 20px 0;
        }

        @keyframes heartbeatBig {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .result-text {
            font-size: 2rem;
            color: #e84393;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .result-subtext {
            font-size: 1.3rem;
            color: #2d3436;
            margin-top: 15px;
            line-height: 1.6;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1000;
        }

        .heart {
            position: absolute;
            font-size: 2rem;
            animation: float 4s ease-in infinite;
            opacity: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .trapped-message {
            color: #e84393;
            font-size: 0.9rem;
            margin-top: 15px;
            font-style: italic;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .trapped-message.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            
            h2 {
                font-size: 1.4rem;
            }
            
            .question {
                font-size: 1.1rem;
            }
            
            button {
                padding: 15px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="hearts-container"></div>

    <div class="container" id="main-container">
        <!-- Logo Squash -->
        <div class="squash-logo"></div>
        <div class="squash-name">SQUASH ENTERPRISE</div>
        
        <!-- Bar progrè -->
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="step-indicator" id="step-indicator">Etap 1 sou 4</div>

        <!-- Kontni kesyon -->
        <div id="question-content">
            <h2 id="greeting-title">Bonjou! 👋</h2>
            
            <div class="question-box">
                <div class="question" id="question-text">
                    Squash te souhaite le bonjour<br>
                    Kijan ou ye?
                </div>
            </div>

            <div class="buttons" id="buttons-container">
                <!-- Bouton yo pral ajoute dynamikman -->
            </div>
            
            <div class="trapped-message" id="trapped-msg">
                😏 Ou pa ka chape! Wi a ap vin pi gwo...
            </div>
        </div>

        <!-- Ekran rezilta final -->
        <div class="result-screen" id="result-screen">
            <div class="big-heart">💝</div>
            <div class="result-text">Ou di WI! 🎉</div>
            <div class="result-subtext">
                Kounye a ou se <strong>Valentine</strong> mwen! 💕<br>
                <em>"Kontrase anrejistre nan sistèm nan!"</em><br><br>
                <span style="font-size: 3rem;">😘❤️😍</span>
            </div>
        </div>
    </div>

    <script>
        // Done yo pou chak etap
        const steps = [
            {
                // Etap 1: Akèy
                title: "Bonjou! 👋",
                question: "Squash te souhaite le bonjour<br>Kijan ou ye?",
                type: "options",
                options: [
                    { text: "Trè byen 😊", value: "tres_bien" },
                    { text: "Pa mal 😐", value: "pas_mal" },
                    { text: "Jis byen 🙂", value: "juste_bien" }
                ],
                progress: 25
            },
            {
                // Etap 2: Egzamen
                title: "Egzamen an 📚",
                question: "Ou prè pou egzamen an?",
                type: "yesno",
                yesText: "Wi ✅",
                noText: "Non ❌",
                progress: 50,
                yesScale: 1,
                noScale: 1
            },
            {
                // Etap 3: Pari (magik la rive isit la!)
                title: "Pari a 🎯",
                question: "Wap kite m genyen pari nou te fè a?",
                type: "trap",
                yesText: "Wi 😇",
                noText: "Non 😈",
                progress: 75,
                trapLevel: 0, // Kòmanse nan nivo 0
                maxTraps: 5   // 5 etap rale soulye
            },
            {
                // Etap 4: Rezilta
                title: "Rezilta Final! 🎊",
                question: "Kounye a ou dwe aksepte konsekans yo...<br>Tu vas être ma Valentine?",
                type: "final",
                yesText: "Wi, ak plezi! 💘",
                noText: "Non...",
                progress: 100,
                yesScale: 3,  // Wi a deja gwo anpil!
                noScale: 0.3  // Non an piti anpil
            }
        ];

        let currentStep = 0;
        let trapCount = 0; // Konbyen fwa yo klike "Non" nan etap 3

        function renderStep() {
            const step = steps[currentStep];
            
            // Mete ajou tit
            document.getElementById('greeting-title').textContent = step.title;
            
            // Mete ajou kesyon
            document.getElementById('question-text').innerHTML = step.question;
            
            // Mete ajou bar progrè
            document.getElementById('progress-fill').style.setProperty('--progress', step.progress + '%');
            document.getElementById('step-indicator').textContent = `Etap ${currentStep + 1} sou ${steps.length}`;
            
            // Kache mesaj "trapped"
            document.getElementById('trapped-msg').classList.remove('show');
            
            // Jenere bouton yo
            const container = document.getElementById('buttons-container');
            container.innerHTML = '';
            
            if (step.type === 'options') {
                // Etap 1: 3 opsyon
                step.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-option';
                    btn.textContent = opt.text;
                    btn.style.setProperty('--option-scale', 1);
                    btn.onclick = () => nextStep();
                    container.appendChild(btn);
                });
            } 
            else if (step.type === 'yesno') {
                // Etap 2: Wi/Non normal
                createYesNoButtons(step, 1, 1);
            }
            else if (step.type === 'trap') {
                // Etap 3: Magik la!
                updateTrapButtons();
            }
            else if (step.type === 'final') {
                // Etap 4: Final
                createYesNoButtons(step, step.yesScale, step.noScale);
            }
        }

        function createYesNoButtons(step, yesScale, noScale) {
            const container = document.getElementById('buttons-container');
            
            // Bouton Wi
            const btnYes = document.createElement('button');
            btnYes.className = 'btn-yes';
            btnYes.textContent = step.yesText;
            btnYes.style.setProperty('--yes-scale', yesScale);
            btnYes.onclick = () => nextStep();
            container.appendChild(btnYes);
            
            // Bouton Non
            const btnNo = document.createElement('button');
            btnNo.className = 'btn-no';
            btnNo.textContent = step.noText;
            btnNo.style.setProperty('--no-scale', noScale);
            
            if (step.type === 'final') {
                btnNo.onclick = () => {
                    // Si yo klike non nan etap final, retounen nan etap 3!
                    trapCount++;
                    currentStep = 2; // Retounen nan etap 3
                    updateTrapButtons();
                    alert("😏 Ou pa ka di non! Retounen nan etap 3!");
                };
            } else {
                btnNo.onclick = () => nextStep();
            }
            
            container.appendChild(btnNo);
        }

        function updateTrapButtons() {
            const step = steps[2]; // Etap 3
            const container = document.getElementById('buttons-container');
            container.innerHTML = '';
            
            // Kalkile gwosè dapre konbyen fwa yo eseye di "Non"
            const yesScale = 1 + (trapCount * 0.5);  // Wi agrandi 50% chak fwa
            const noScale = Math.max(0.3, 1 - (trapCount * 0.2)); // Non retresi 20% chak fwa
            
            // Mete ajou kesyon pou pi komik
            const questions = [
                "Wap kite m genyen pari nou te fè a?",
                "Ou sèten? Gade bouton yo byen... 👀",
                "Wi a ap vin pi gwo, ou pa wè sa? 😏",
                "Non an pral disparèt talè! Chwazi wi! 🎈",
                "Dènye chans ou! Wi a GWO anpil kounye a! 🚀",
                "TOO LATE! Wi a dominan! 😂"
            ];
            
            const qIndex = Math.min(trapCount, questions.length - 1);
            document.getElementById('question-text').innerHTML = questions[qIndex];
            
            // Montre mesaj "trapped"
            if (trapCount > 0) {
                document.getElementById('trapped-msg').classList.add('show');
            }
            
            // Bouton Wi (ki ap vin pi gwo)
            const btnYes = document.createElement('button');
            btnYes.className = 'btn-yes';
            btnYes.textContent = trapCount > 3 ? "WI WI WI! 🎉" : step.yesText;
            btnYes.style.setProperty('--yes-scale', yesScale);
            
            // Si wi a two gwo (plis pase 3 fwa), li kouvri tout!
            if (yesScale > 2.5) {
                btnYes.style.padding = '30px 60px';
                btnYes.style.fontSize = '1.8rem';
            }
            
            btnYes.onclick = () => {
                currentStep = 3; // Ale nan etap final
                renderStep();
            };
            container.appendChild(btnYes);
            
            // Bouton Non (ki ap vin pi piti)
            const btnNo = document.createElement('button');
            btnNo.className = 'btn-no';
            btnNo.textContent = trapCount > 3 ? "non... 😅" : step.noText;
            btnNo.style.setProperty('--no-scale', noScale);
            
            if (trapCount >= 5) {
                // Apre 5 fwa, kache non an totalman oswa fèl enaktif
                btnNo.style.opacity = '0.1';
                btnNo.style.pointerEvents = 'none';
                btnNo.textContent = '...';
            }
            
            btnNo.onclick = () => {
                trapCount++;
                updateTrapButtons();
                
                // Efè tranblad
                document.getElementById('main-container').style.animation = 'none';
                setTimeout(() => {
                    document.getElementById('main-container').style.animation = 'bounceIn 0.4s ease';
                }, 10);
            };
            
            container.appendChild(btnNo);
        }

        function nextStep() {
            if (currentStep < steps.length - 1) {
                currentStep++;
                renderStep();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            // Kache tout kesyon
            document.getElementById('question-content').style.display = 'none';
            document.getElementById('step-indicator').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'none';
            
            // Montre rezilta
            document.getElementById('result-screen').classList.add('show');
            
            // Lage konfeti ak kè
            createHearts();
            setInterval(createHearts, 1000);
        }

        function createHearts() {
            const container = document.getElementById('hearts-container');
            const hearts = ['💕', '💖', '💗', '💓', '💝', '❤️', '😍', '😘'];
            
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (3 + Math.random() * 2) + 's';
                    heart.style.fontSize = (1 + Math.random() * 2) + 'rem';
                    container.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 5000);
                }, i * 200);
            }
        }

        // Kòmanse jwèt la
        renderStep();
    </script>
</body>
</html>
